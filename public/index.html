<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ربط تيك توك مع اللعبة</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>ربط TikTok مع اللعبة</h1>
      <p class="sub">اكتب كود الغرفة من داخل اللعبة، ثم اكتب يوزر تيك توك بدون @ واضغط بدء الربط.</p>

      <label>كود الغرفة</label>
      <input id="roomCode" placeholder="مثال: ABC12345" />

      <label>يوزر تيك توك</label>
      <input id="username" placeholder="مثال: myliveuser" />

      <div class="buttons">
        <button id="startBtn">بدء الربط</button>
        <button id="stopBtn" class="secondary">إيقاف الربط</button>
      </div>

      <p id="status" class="status">جاهز</p>
    </section>

    <section class="card small">
      <h2>ماذا أفعل؟</h2>
      <ol>
        <li>افتح اللعبة.</li>
        <li>خذ كود الغرفة الظاهر داخل اللعبة.</li>
        <li>اكتب كود الغرفة هنا.</li>
        <li>اكتب يوزر تيك توك بدون @.</li>
        <li>اضغط بدء الربط.</li>
      </ol>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
